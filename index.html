<h1 id="contact">Contact</h1>
<p>For more information, reach out to <a href="mailto:mail@jmit.ca">mail@jmit.ca</a></p>
<script>
    const targetDate = new Date('2026-03-01');
    const now = new Date();
    const diffTime = targetDate - now;
    const daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    const countdownEl = document.querySelector('.countdown');
    if (daysLeft > 0) {
    countdownEl.textContent = `Launching in ${daysLeft} days`;
    } else if (daysLeft === 0) {
    countdownEl.textContent = 'Today is the day!';
    } else {
    countdownEl.textContent = `${Math.abs(daysLeft)} days ago`;
    }
</script>
